<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="osiris.cheminfo">
  <title>osiris.cheminfo</title>
  <!-- Three parallel axes with one profile crossing them: the plot a set of
       molecules is read on, and the single line one molecule draws through it.
       Same geometry as the mark in react-cheminfo's glyphs.tsx, with the
       colours written out: a file served on its own cannot read the page's
       tokens, so the two drift silently unless both are changed together. -->
  <rect width="32" height="32" rx="7" fill="#854d0e" />
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M7.4 6.8V25.2M16 6.8V25.2M24.6 6.8V25.2" />
  </g>
  <path
    d="M7.4 21.6 16 10.4 24.6 17.2"
    fill="none"
    stroke="#60a5fa"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
